thoughts_on_life:
  en: "I’ve always believed in the motto: “The most precious gift God has ever given us is the world.” Beyond research, I’m passionate about water sports, including swimming (I’m a Level-2 athlete), surfing, windsurfing, and kayaking. I’m also deeply committed to global exploration and volunteer work. My travels have taken me to cities across countries such as China, Germany, Singapore, the United States, and Canada. For the past two years, I’ve spent my summer vacations in Sanya, China, volunteering as a coastal lifeguard, a meaningful experience I intend to continue in the years ahead. May god bless everyone, and may god bless me!"
  zh: "我一直信奉这样一句话：“上帝赐予我们最珍贵的礼物，就是这个世界。”科研之外，我热爱水上运动，包括游泳（国家二级运动员）、冲浪、帆板和皮划艇。我也十分热心于环球探索与志愿服务，旅途已带我走过中国、德国、新加坡、美国和加拿大等国家的许多城市。过去两年，我在中国三亚度过暑假，作为志愿者担任海岸救生员——这是一段很有意义的经历，我也打算在未来的岁月里继续下去。愿上帝保佑每一个人，也愿上帝保佑我！"
