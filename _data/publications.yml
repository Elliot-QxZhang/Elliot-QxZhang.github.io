- title:    "PRET is a few-shot system for pan-cancer recognition without example training"
  date:     2026-05-01 00:01:00 +0800
  selected: true
  pub:      'Nature Cancer <span class="badge badge-info">SCI Q1</span>'
  pub_last: ' <span class="badge badge-pill badge-primary badge-publication">WSI Analysis</span> <img alt="GitHub Repo stars" src="https://img.shields.io/github/stars/xmed-lab/PRET?style=social">'
  pub_date: "2026"
  cover:    /assets/images/covers/pret.png
  abstract:
    en: >-
      ...In this paper, we introduce a novel paradigm, Pan-cancer Recognition via Examples without Training (PRET). The proposed PRET learns from a few examples during the inference phase without model fine-tuning, offering a flexible, scalable, and effective solution to recognize cancers across diverse organs, hospitals, and tasks using a single model only. Through extensive evaluations across international hospitals and diverse benchmarks, our method outperforms existing approaches across 20 tasks, achieving performances over 97% on 15 benchmarks at a maximum improvement of 36.76%...
    zh: >-
      ……本文提出了一种新范式——无需训练的示例驱动泛癌识别（Pan-cancer Recognition via Examples without Training, PRET）。PRET 在推理阶段从少量示例中学习，无需对模型进行微调，仅用单一模型即可灵活、可扩展且有效地识别不同器官、不同医院与不同任务中的癌症。在跨国际医院与多种基准的大量评测中，我们的方法在 20 项任务上超越了现有方法，在 15 个基准上取得了超过 97% 的性能，最大提升达 36.76%……
