      ……我们提出 RCMed，一个在输入与输出两端同时强化多模态对齐的全栈式 AI 助手，通过层次化的视觉—语言接地，为临床医生提供精确的解剖结构勾画、准确的定位与可靠的诊断。RCMed 在包含 2000 万组「图像—掩膜—描述」三元组的数据集上训练，在刻画不规则病灶与细微解剖边界方面达到当前最优精度，并在涵盖 9 种模态的 165 项临床任务中表现优异……
