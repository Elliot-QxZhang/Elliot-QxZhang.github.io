# Publications.
#
# Order in this file does not matter -- templates sort by `date` descending and
# group by year on the /publications page.
#
# Fields:
#   title      Paper title. Kept in English on both language versions, since a
#              paper title is a citable identifier.
#   date       Drives sort order and the year grouping.
#   selected   true -> also shown in the "Selected Publications" card on the home page.
#   pub        Venue. Proper noun, shared across languages.
#   pub_pre    Optional text before the venue (e.g. "Submitted to ").
#   pub_post   Optional text after the venue.
#   pub_last   Optional raw HTML appended after the links (topic badges, star shields).
#   pub_date   Year shown next to the venue.
#   cover      Cover image path. Omit to fall back to a generated visual hash.
#   authors    List of names; keys into _data/authors.yml. Trailing "*" marks equal
#              contribution, trailing "#" marks corresponding author.
#   links      Label -> URL. Omit a label entirely rather than leaving it empty.
#   abstract   Optional. Translated, so it takes `en` / `zh` sub-keys.

