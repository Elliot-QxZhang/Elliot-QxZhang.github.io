short_bio:
  en: >-
    <p>
      I am a Year-2 Ph.D. candidate at The Hong Kong University of Science and Technology (HKUST) under the supervision of <a href="https://xmengli.github.io/" target="_blank">Prof. Xiaomeng LI</a>. My research lies in the interdisciplinary areas of artificial intelligence and medical image analysis, aiming at advancing healthcare with machine intelligence. Specifically, I am currently working on advancing Neural Science with AI solutions.
    </p>
    <p>
      Previously, I received B.Eng degree in Software Engineering at Sichuan University, and closely collaborated with <a href="https://cs.scu.edu.cn/info/1075/8235.htm" target="_blank">Prof. Yan Wang</a> as an undergraduate research intern.
    </p>
  zh: >-
    <p>
      我是香港科技大学（HKUST）博士二年级研究生，师从<a href="https://xmengli.github.io/" target="_blank">李小萌教授（Prof. Xiaomeng LI）</a>。我的研究处于人工智能与医学图像分析的交叉领域，致力于用机器智能推动医疗健康的发展。目前，我主要研究用 AI 方法推进神经科学（Neural Science）。
    </p>
    <p>
      此前，我在四川大学获得软件工程学士学位，并作为本科科研实习生与<a href="https://cs.scu.edu.cn/info/1075/8235.htm" target="_blank">王艳教授（Prof. Yan Wang）</a>密切合作。
    </p>

