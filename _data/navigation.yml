pages:
# NOTE: `key` must match the `navbar_key` field in the page's front matter so the
#       navbar highlights the current page. Matching on `key` rather than on the
#       displayed label keeps highlighting correct in every language.
#
# `url` is the English (default) path. Chinese pages live under the same path
# prefixed with /zh, which the navbar derives automatically.
- key: home
  url: /
  label:
    en: Home
    zh: 主页
- key: publications
  url: /publications
  label:
    en: Publications
    zh: 学术成果
